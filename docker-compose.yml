version: '3.8'

x-env-defaults: &env-defaults
  GATEWAY_URL: http://gateway:8000
  INPUT_GUARD_URL: http://input_guard:8001
  OUTPUT_GUARD_URL: http://output_guard:8002
  PII_SERVICE_URL: http://pii_service:8003
  POLICY_ENGINE_URL: http://policy_engine:8004
  ROUTER_URL: http://router:8005
  ADAPTER_URL: http://adapter:8006
  AUDIT_STORE_URL: http://audit_store:8007
  REVIEW_CONSOLE_URL: http://review_console:8008
  IMMUNE_SYSTEM_URL: http://immune_system:8009
  ACTION_GUARD_URL: http://action_guard:8010
  GUARDRAILS_ML_URL: http://guardrails_ml:8011
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - controlplane-net
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    - ./policies:/app/policies
  env_file:
    - .env
  environment:
    <<: *env-defaults

services:
  # ─── 1. Storage & Foundation Services ───────────────────────────────────────
  audit_store:
    <<: *service-defaults
    container_name: cp-audit-store
    environment:
      <<: *env-defaults
      SERVICE_MODULE: audit_store
      PORT: 8007
    ports:
      - "8007:8007"

  pii_service:
    <<: *service-defaults
    container_name: cp-pii-service
    environment:
      <<: *env-defaults
      SERVICE_MODULE: pii_service
      PORT: 8003
    ports:
      - "8003:8003"

  policy_engine:
    <<: *service-defaults
    container_name: cp-policy-engine
    environment:
      <<: *env-defaults
      SERVICE_MODULE: policy_engine
      PORT: 8004
    ports:
      - "8004:8004"

  guardrails_ml:
    <<: *service-defaults
    container_name: cp-guardrails-ml
    environment:
      <<: *env-defaults
      SERVICE_MODULE: guardrails_ml
      PORT: 8011
    ports:
      - "8011:8011"

  # ─── 2. Guards ───────────────────────────────────────────────────────────────
  input_guard:
    <<: *service-defaults
    container_name: cp-input-guard
    environment:
      <<: *env-defaults
      SERVICE_MODULE: input_guard
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      - guardrails_ml
      - pii_service
      - policy_engine

  output_guard:
    <<: *service-defaults
    container_name: cp-output-guard
    environment:
      <<: *env-defaults
      SERVICE_MODULE: output_guard
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      - guardrails_ml
      - pii_service
      - policy_engine

  action_guard:
    <<: *service-defaults
    container_name: cp-action-guard
    environment:
      <<: *env-defaults
      SERVICE_MODULE: action_guard
      PORT: 8010
    ports:
      - "8010:8010"

  # ─── 3. Pipeline & Routing ───────────────────────────────────────────────────
  router:
    <<: *service-defaults
    container_name: cp-router
    environment:
      <<: *env-defaults
      SERVICE_MODULE: router
      PORT: 8005
    ports:
      - "8005:8005"
    depends_on:
      - guardrails_ml

  adapter:
    <<: *service-defaults
    container_name: cp-adapter
    environment:
      <<: *env-defaults
      SERVICE_MODULE: adapter
      PORT: 8006
    ports:
      - "8006:8006"

  # ─── 4. Monitoring & Immune System ──────────────────────────────────────────
  review_console:
    <<: *service-defaults
    container_name: cp-review-console
    environment:
      <<: *env-defaults
      SERVICE_MODULE: review_console
      PORT: 8008
    ports:
      - "8008:8008"
    depends_on:
      - audit_store

  immune_system:
    <<: *service-defaults
    container_name: cp-immune-system
    environment:
      <<: *env-defaults
      SERVICE_MODULE: immune_system
      PORT: 8009
    ports:
      - "8009:8009"
    depends_on:
      - audit_store
      - policy_engine

  # ─── 5. API Gateway (Main Entry Point) ──────────────────────────────────────
  gateway:
    <<: *service-defaults
    container_name: cp-gateway
    environment:
      <<: *env-defaults
      SERVICE_MODULE: gateway
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - input_guard
      - output_guard
      - router
      - adapter
      - audit_store
      - review_console
      - policy_engine

  # ─── 6. React Frontend Dashboard ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - controlplane-net
    depends_on:
      - gateway

networks:
  controlplane-net:
    driver: bridge

