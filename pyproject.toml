[project]
name = "controlplane-ai"
version = "0.1.0"
description = "ControlPlane.ai - Responsible AI Control Plane Middleware"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",

    # Data validation
    "pydantic>=2.9.0",

    # Database
    "aiosqlite>=0.20.0",

    # Guardrail libraries
    "detect-secrets>=1.4.0",

    # PII detection
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",

    # ML Training, Classification & Embeddings
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "datasets>=3.0.0",
    "huggingface-hub[cli]>=0.25.0",
    "pandas>=2.0.0",

    # Utilities
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["services*", "shared*", "train*"]