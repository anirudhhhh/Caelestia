[project]
name = "controlplane-ai"
version = "0.1.0"
description = "ControlPlane.ai — Responsible AI Control Plane Middleware"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",

    # Data validation
    "pydantic>=2.9.0",

    # Database
    "aiosqlite>=0.20.0",

    # Guardrail libraries
    "llm-guard>=0.3.0",
    "detect-secrets>=1.4.0",

    # PII detection
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",

    # LLM providers
    "litellm>=1.40.0",
    "openai>=1.30.0",
    "google-generativeai>=0.8.0",

    # Semantic routing
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",

    # Utilities
    "pyyaml>=6.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
